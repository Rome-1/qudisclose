<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" role="img" aria-label="Four VSLA levels drawn as a staircase from L0 Unattested to L3 Hardened" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#15161d"><title>The VSLA ladder</title><defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f7bff"/><stop offset="1" stop-color="#a45cf0"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fb6a6"/><stop offset="1" stop-color="#12857a"/></linearGradient></defs><rect x="1" y="1" width="1038" height="618" rx="22" fill="#fffdf8" stroke="#e9e2d6" stroke-width="2"/><text x="44" y="54" font-size="26" fill="#15161d" font-weight="600" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" opacity="1.0">The VSLA ladder</text><text x="44" y="80" font-size="14" fill="#6b6f80" font-weight="400" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-style="italic" opacity="1.0">Each level is a floor: every requirement of the levels below it, plus its own.</text><rect x="44" y="438" width="236" height="112" rx="16" fill="#eceef3" stroke="#9aa0b4" stroke-width="2" opacity="1.0"/><text x="62" y="474" font-size="30" fill="#9aa0b4" font-weight="700" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" opacity="1.0">L0</text><text x="114" y="474" font-size="22" fill="#15161d" font-weight="600" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" opacity="1.0">Unattested</text><text x="62" y="502" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">No attestation.</text><text x="62" y="519" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">An email, an issue, a</text><text x="62" y="536" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">scanner dump. Trust</text><text x="62" y="553" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">is whoever sent it.</text><rect x="284" y="346" width="236" height="204" rx="16" fill="#fff3d6" stroke="#ffc24a" stroke-width="2" opacity="1.0"/><text x="302" y="382" font-size="30" fill="#ffc24a" font-weight="700" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" opacity="1.0">L1</text><text x="354" y="382" font-size="22" fill="#15161d" font-weight="600" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" opacity="1.0">Attested</text><text x="302" y="410" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">Signed statement:</text><text x="302" y="427" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">model bill of materials,</text><text x="302" y="444" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">Merkle-rooted transcript,</text><text x="302" y="461" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">reproduction re-run by code.</text><rect x="524" y="254" width="236" height="296" rx="16" fill="#dcf5f1" stroke="#1fb6a6" stroke-width="2" opacity="1.0"/><text x="542" y="290" font-size="30" fill="#1fb6a6" font-weight="700" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" opacity="1.0">L2</text><text x="594" y="290" font-size="22" fill="#15161d" font-weight="600" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" opacity="1.0">Trusted</text><text x="542" y="318" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">+ Platform countersignature</text><text x="542" y="335" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">on receipt (authoritative</text><text x="542" y="352" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">channel) and a signed trust</text><text x="542" y="369" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">history with maintainers.</text><rect x="764" y="162" width="236" height="388" rx="16" fill="#eee3fb" stroke="#a45cf0" stroke-width="2" opacity="1.0"/><text x="782" y="198" font-size="30" fill="#a45cf0" font-weight="700" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" opacity="1.0">L3</text><text x="834" y="198" font-size="22" fill="#15161d" font-weight="600" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" opacity="1.0">Hardened</text><text x="782" y="226" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">+ Weights and harness served</text><text x="782" y="243" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">from an attested enclave:</text><text x="782" y="260" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">non-forgeable provenance,</text><text x="782" y="277" font-size="12.5" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">non-tamperable weights.</text><g transform="translate(882 50) scale(0.95)"><defs><linearGradient id="lqh" x1="24" y1="26" x2="98" y2="106" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6bd86"/><stop offset="1" stop-color="#c97a41"/></linearGradient><linearGradient id="lqf" x1="28" y1="44" x2="92" y2="74" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6f7bff"/><stop offset="1" stop-color="#a45cf0"/></linearGradient><linearGradient id="lqs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fb6a6"/><stop offset="1" stop-color="#12857a"/></linearGradient><linearGradient id="lqv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f7bff"/><stop offset="1" stop-color="#a45cf0"/></linearGradient><radialGradient id="lql" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#2a2d4a"/><stop offset="1" stop-color="#0d0e17"/></radialGradient><radialGradient id="lqe" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#c8f5ff"/><stop offset="1" stop-color="#59d4ff"/></radialGradient></defs><path d="M60 30V17" stroke="#a8632f" stroke-width="3.6" stroke-linecap="round"/><circle cx="60" cy="12.500" r="6" fill="#ffc24a"/><circle cx="58.200" cy="10.800" r="1.800" fill="#fff" opacity=".8"/><g transform="rotate(-20 31 30)"><ellipse cx="31" cy="29" rx="13.5" ry="16" fill="url(#lqh)"/><ellipse cx="31" cy="31" rx="7.2" ry="9.4" fill="#8a4f2c"/><path d="M27.4 29h7.200M27.4 33.500h7.200" stroke="#f6bd86" stroke-width="1.700" stroke-linecap="round" opacity=".8"/></g><g transform="rotate(20 89 30)"><ellipse cx="89" cy="29" rx="13.5" ry="16" fill="url(#lqh)"/><ellipse cx="89" cy="31" rx="7.2" ry="9.4" fill="#8a4f2c"/><path d="M85.4 29h7.200M85.4 33.500h7.200" stroke="#f6bd86" stroke-width="1.700" stroke-linecap="round" opacity=".8"/></g><g transform="translate(88 2) rotate(12 16 20)"><rect x="0" y="0" width="34" height="38" rx="8" fill="url(#lqv)"/><rect x="7" y="25" width="20" height="4.5" rx="2.25" fill="#ffc24a"/><rect x="7" y="16.5" width="20" height="4.5" rx="2.25" fill="#1fb6a6"/><rect x="7" y="8" width="20" height="4.5" rx="2.25" fill="#fff"/></g><path d="M60 30C87 30 105 45 105 67C105 91 86 107 60 107C34 107 15 91 15 67C15 45 33 30 60 30Z" fill="url(#lqh)"/><path d="M29 46Q38 36 53 35" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".4"/><path d="M16 60Q22 55.500 30 57M104 60Q98 55.500 90 57" stroke="url(#lqf)" stroke-width="6" stroke-linecap="round" fill="none"/><ellipse cx="60" cy="86" rx="21" ry="15" fill="#ffeeda"/><path d="M55.500 59h9" stroke="url(#lqf)" stroke-width="5" stroke-linecap="round"/><circle cx="42.5" cy="58.500" r="13.800" fill="url(#lql)" stroke="url(#lqf)" stroke-width="5"/><circle cx="42.5" cy="58.500" r="6.400" fill="url(#lqe)"/><circle cx="43.3" cy="59" r="2.900" fill="#0d0e17"/><circle cx="41.0" cy="56.600" r="1.300" fill="#fff"/><path d="M34.0 52.500a10.500 10.500 0 0 1 6.500-5.500" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".55"/><circle cx="77.5" cy="58.500" r="13.800" fill="url(#lql)" stroke="url(#lqf)" stroke-width="5"/><circle cx="77.5" cy="58.500" r="6.400" fill="url(#lqe)"/><circle cx="78.3" cy="59" r="2.900" fill="#0d0e17"/><circle cx="76.0" cy="56.600" r="1.300" fill="#fff"/><path d="M69.0 52.500a10.500 10.500 0 0 1 6.500-5.500" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".55"/><ellipse cx="60" cy="79.500" rx="6.800" ry="4.800" fill="#1b1423"/><ellipse cx="58.200" cy="78.300" rx="2" ry="1.100" fill="#fff" opacity=".6"/><path d="M60 84.300V88M48.500 88.500Q60 98.500 71.500 88.500" stroke="#1b1423" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="24.500" cy="79" r="2.300" fill="#c97a41" opacity=".8"/><circle cx="95.500" cy="79" r="2.300" fill="#c97a41" opacity=".8"/></g><g transform="translate(414 234) scale(0.78)"><defs><linearGradient id="lfh" x1="24" y1="26" x2="98" y2="106" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6bd86"/><stop offset="1" stop-color="#c97a41"/></linearGradient><linearGradient id="lff" x1="28" y1="44" x2="92" y2="74" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6f7bff"/><stop offset="1" stop-color="#a45cf0"/></linearGradient><linearGradient id="lfs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fb6a6"/><stop offset="1" stop-color="#12857a"/></linearGradient><linearGradient id="lfv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f7bff"/><stop offset="1" stop-color="#a45cf0"/></linearGradient><radialGradient id="lfl" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#2a2d4a"/><stop offset="1" stop-color="#0d0e17"/></radialGradient><radialGradient id="lfe" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#c8f5ff"/><stop offset="1" stop-color="#59d4ff"/></radialGradient></defs><path d="M60 30V17" stroke="#a8632f" stroke-width="3.6" stroke-linecap="round"/><circle cx="60" cy="12.500" r="6" fill="#ffc24a"/><circle cx="58.200" cy="10.800" r="1.800" fill="#fff" opacity=".8"/><g transform="rotate(-20 31 30)"><ellipse cx="31" cy="29" rx="13.5" ry="16" fill="url(#lfh)"/><ellipse cx="31" cy="31" rx="7.2" ry="9.4" fill="#8a4f2c"/><path d="M27.4 29h7.200M27.4 33.500h7.200" stroke="#f6bd86" stroke-width="1.700" stroke-linecap="round" opacity=".8"/></g><g transform="rotate(20 89 30)"><ellipse cx="89" cy="29" rx="13.5" ry="16" fill="url(#lfh)"/><ellipse cx="89" cy="31" rx="7.2" ry="9.4" fill="#8a4f2c"/><path d="M85.4 29h7.200M85.4 33.500h7.200" stroke="#f6bd86" stroke-width="1.700" stroke-linecap="round" opacity=".8"/></g><path d="M60 30C87 30 105 45 105 67C105 91 86 107 60 107C34 107 15 91 15 67C15 45 33 30 60 30Z" fill="url(#lfh)"/><path d="M29 46Q38 36 53 35" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".4"/><path d="M16 60Q22 55.500 30 57M104 60Q98 55.500 90 57" stroke="url(#lff)" stroke-width="6" stroke-linecap="round" fill="none"/><ellipse cx="60" cy="86" rx="21" ry="15" fill="#ffeeda"/><path d="M55.500 59h9" stroke="url(#lff)" stroke-width="5" stroke-linecap="round"/><circle cx="42.5" cy="58.500" r="13.800" fill="url(#lfl)" stroke="url(#lff)" stroke-width="5"/><circle cx="42.5" cy="58.500" r="6.400" fill="url(#lfe)"/><circle cx="43.3" cy="59" r="2.900" fill="#0d0e17"/><circle cx="41.0" cy="56.600" r="1.300" fill="#fff"/><path d="M34.0 52.500a10.500 10.500 0 0 1 6.500-5.500" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".55"/><circle cx="77.5" cy="58.500" r="13.800" fill="url(#lfl)" stroke="url(#lff)" stroke-width="5"/><circle cx="77.5" cy="58.500" r="6.400" fill="url(#lfe)"/><circle cx="78.3" cy="59" r="2.900" fill="#0d0e17"/><circle cx="76.0" cy="56.600" r="1.300" fill="#fff"/><path d="M69.0 52.500a10.500 10.500 0 0 1 6.500-5.500" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".55"/><ellipse cx="60" cy="79.500" rx="6.800" ry="4.800" fill="#1b1423"/><ellipse cx="58.200" cy="78.300" rx="2" ry="1.100" fill="#fff" opacity=".6"/><path d="M60 84.300V88M48.500 88.500Q60 98.500 71.500 88.500" stroke="#1b1423" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="24.500" cy="79" r="2.300" fill="#c97a41" opacity=".8"/><circle cx="95.500" cy="79" r="2.300" fill="#c97a41" opacity=".8"/><g transform="translate(78 70) rotate(-35)"><path d="M14 14l16 16" stroke="#2b2740" stroke-width="6" stroke-linecap="round"/><circle cx="2" cy="2" r="13" fill="#dff7ff" fill-opacity=".55" stroke="url(#lfv)" stroke-width="4.5"/><path d="M-6 -2a8 8 0 0 1 6-6" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8"/></g></g><text x="520.0" y="598" font-size="12.5" fill="#6b6f80" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic" opacity="1.0">A verifier never takes a claimed level at face value: it recomputes the level from the evidence it can check (§ Verification).</text></svg>
