<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="A chain of six verification checks reducing a claimed Level 3 to a verified Level 1" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#15161d"><title>Claimed versus verified</title><defs><marker id="arr2b2740" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b2740"/></marker><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f7bff"/><stop offset="1" stop-color="#a45cf0"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fb6a6"/><stop offset="1" stop-color="#12857a"/></linearGradient></defs><rect x="1" y="1" width="998" height="378" rx="22" fill="#fffdf8" stroke="#e9e2d6" stroke-width="2"/><text x="44" y="54" font-size="26" fill="#15161d" font-weight="600" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" opacity="1.0">Claimed is not verified</text><text x="44" y="80" font-size="14" fill="#6b6f80" font-weight="400" text-anchor="start" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-style="italic" opacity="1.0">The level in a statement is a claim. The level on a case is what the receiver could check.</text><rect x="44" y="160" width="35.84" height="26" rx="13.0" fill="#a45cf0" stroke="#a45cf0" stroke-width="1.5" opacity="1.0"/><text x="61.92" y="177" font-size="16" fill="#fff" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">L3</text><text x="44" y="215" font-size="12" fill="#6b6f80" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">claimed</text><path d="M110 172L180 172" stroke="#2b2740" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arr2b2740)"/><rect x="200" y="130" width="96" height="84" rx="12" fill="#fff" stroke="#1fb6a6" stroke-width="2" opacity="1.0"/><text x="248" y="158" font-size="13" fill="#15161d" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">sig</text><text x="248" y="190" font-size="12" fill="#1fb6a6" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" opacity="1.0">✓</text><path d="M298 172L306 172" stroke="#2b2740" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr2b2740)"/><rect x="308" y="130" width="96" height="84" rx="12" fill="#fff" stroke="#1fb6a6" stroke-width="2" opacity="1.0"/><text x="356" y="158" font-size="13" fill="#15161d" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">merkle</text><text x="356" y="190" font-size="12" fill="#1fb6a6" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" opacity="1.0">✓</text><path d="M406 172L414 172" stroke="#2b2740" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr2b2740)"/><rect x="416" y="130" width="96" height="84" rx="12" fill="#fff" stroke="#1fb6a6" stroke-width="2" opacity="1.0"/><text x="464" y="158" font-size="13" fill="#15161d" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">re-run</text><text x="464" y="190" font-size="12" fill="#1fb6a6" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" opacity="1.0">✓ exit 1</text><path d="M514 172L522 172" stroke="#2b2740" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr2b2740)"/><rect x="524" y="130" width="96" height="84" rx="12" fill="#fff" stroke="#1fb6a6" stroke-width="2" opacity="1.0"/><text x="572" y="158" font-size="13" fill="#15161d" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">channel</text><text x="572" y="190" font-size="12" fill="#1fb6a6" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" opacity="1.0">✓</text><path d="M622 172L630 172" stroke="#2b2740" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr2b2740)"/><rect x="632" y="130" width="96" height="84" rx="12" fill="#fff" stroke="#f0607a" stroke-width="2" opacity="1.0"/><text x="680" y="158" font-size="13" fill="#15161d" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">ledger</text><text x="680" y="190" font-size="12" fill="#f0607a" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" opacity="1.0">✗ 2 prior</text><path d="M730 172L738 172" stroke="#2b2740" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr2b2740)"/><rect x="740" y="130" width="96" height="84" rx="12" fill="#fff" stroke="#f0607a" stroke-width="2" opacity="1.0"/><text x="788" y="158" font-size="13" fill="#15161d" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">quote</text><text x="788" y="190" font-size="12" fill="#f0607a" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" opacity="1.0">✗ none</text><path d="M840 172L878 172" stroke="#2b2740" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arr2b2740)"/><rect x="884" y="160" width="35.84" height="26" rx="13.0" fill="#ffc24a" stroke="#ffc24a" stroke-width="1.5" opacity="1.0"/><text x="901.92" y="177" font-size="16" fill="#15161d" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">L1</text><text x="884" y="215" font-size="12" fill="#6b6f80" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">verified</text><text x="44" y="262" font-size="12" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">Evidence ✓, Identity ✗ (the ledger is too thin for L2), Environment ✗ (no quote). The weakest pillar sets the level, so the case is recorded at L1</text><text x="44" y="279" font-size="12" fill="#2b2740" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="1.0">with the claim and every check in the audit chain. A finder that over-claims repeatedly loses ledger score; a platform that over-grants loses its own.</text><g transform="translate(880 10) scale(0.6)"><defs><linearGradient id="vqh" x1="24" y1="26" x2="98" y2="106" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6bd86"/><stop offset="1" stop-color="#c97a41"/></linearGradient><linearGradient id="vqf" x1="28" y1="44" x2="92" y2="74" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6f7bff"/><stop offset="1" stop-color="#a45cf0"/></linearGradient><linearGradient id="vqs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fb6a6"/><stop offset="1" stop-color="#12857a"/></linearGradient><linearGradient id="vqv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f7bff"/><stop offset="1" stop-color="#a45cf0"/></linearGradient><radialGradient id="vql" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#2a2d4a"/><stop offset="1" stop-color="#0d0e17"/></radialGradient><radialGradient id="vqe" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#c8f5ff"/><stop offset="1" stop-color="#59d4ff"/></radialGradient></defs><path d="M60 30V17" stroke="#a8632f" stroke-width="3.6" stroke-linecap="round"/><circle cx="60" cy="12.500" r="6" fill="#ffc24a"/><circle cx="58.200" cy="10.800" r="1.800" fill="#fff" opacity=".8"/><g transform="rotate(-20 31 30)"><ellipse cx="31" cy="29" rx="13.5" ry="16" fill="url(#vqh)"/><ellipse cx="31" cy="31" rx="7.2" ry="9.4" fill="#8a4f2c"/><path d="M27.4 29h7.200M27.4 33.500h7.200" stroke="#f6bd86" stroke-width="1.700" stroke-linecap="round" opacity=".8"/></g><g transform="rotate(20 89 30)"><ellipse cx="89" cy="29" rx="13.5" ry="16" fill="url(#vqh)"/><ellipse cx="89" cy="31" rx="7.2" ry="9.4" fill="#8a4f2c"/><path d="M85.4 29h7.200M85.4 33.500h7.200" stroke="#f6bd86" stroke-width="1.700" stroke-linecap="round" opacity=".8"/></g><path d="M60 30C87 30 105 45 105 67C105 91 86 107 60 107C34 107 15 91 15 67C15 45 33 30 60 30Z" fill="url(#vqh)"/><path d="M29 46Q38 36 53 35" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".4"/><path d="M16 60Q22 55.500 30 57M104 60Q98 55.500 90 57" stroke="url(#vqf)" stroke-width="6" stroke-linecap="round" fill="none"/><ellipse cx="60" cy="86" rx="21" ry="15" fill="#ffeeda"/><path d="M55.500 59h9" stroke="url(#vqf)" stroke-width="5" stroke-linecap="round"/><circle cx="42.5" cy="58.500" r="13.800" fill="url(#vql)" stroke="url(#vqf)" stroke-width="5"/><circle cx="42.5" cy="58.500" r="6.400" fill="url(#vqe)"/><circle cx="43.3" cy="59" r="2.900" fill="#0d0e17"/><circle cx="41.0" cy="56.600" r="1.300" fill="#fff"/><path d="M34.0 52.500a10.500 10.500 0 0 1 6.500-5.500" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".55"/><circle cx="77.5" cy="58.500" r="13.800" fill="url(#vql)" stroke="url(#vqf)" stroke-width="5"/><circle cx="77.5" cy="58.500" r="6.400" fill="url(#vqe)"/><circle cx="78.3" cy="59" r="2.900" fill="#0d0e17"/><circle cx="76.0" cy="56.600" r="1.300" fill="#fff"/><path d="M69.0 52.500a10.500 10.500 0 0 1 6.500-5.500" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".55"/><ellipse cx="60" cy="79.500" rx="6.800" ry="4.800" fill="#1b1423"/><ellipse cx="58.200" cy="78.300" rx="2" ry="1.100" fill="#fff" opacity=".6"/><path d="M60 84.300V88M48.500 88.500Q60 98.500 71.500 88.500" stroke="#1b1423" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="24.500" cy="79" r="2.300" fill="#c97a41" opacity=".8"/><circle cx="95.500" cy="79" r="2.300" fill="#c97a41" opacity=".8"/><g transform="translate(6 76) rotate(18)"><rect x="0" y="0" width="26" height="9" rx="3" fill="#2b2740"/><rect x="9" y="-10" width="8" height="12" rx="2.5" fill="#2b2740"/><circle cx="13" cy="-15" r="8.5" fill="url(#vqs)" stroke="#12857a" stroke-width="1.5"/><path d="M9 -15l3 3l6 -6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g></svg>
