        <path d="M96 58 q20 -26 50 -30" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"></path>
        <path d="M90 172 q60 30 120 0" fill="none" stroke="#c9ced8" stroke-width="10" stroke-linecap="round"></path>
        <path d="M90 172 q60 30 120 0" fill="none" stroke="#9aa2b1" stroke-width="2" stroke-linecap="round" opacity="0.7" transform="translate(0,5)"></path>
